<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio ~ Game Works</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/images/Tangerine_icon.png">
</head>

<body class="works-page" id="top">
    <header class="site-header">
        <h1 class="visually-hidden">Game Works</h1>
        <div class="header-inner">
            <nav class="site-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">illustrations</a></li>
                    <li><a class="active" href="works.html" aria-current="page">games</a></li>
                    <li><a href="about&amp;contact.html">about me</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <p class="site-name">MINJA TOMAŠEVIĆ'S PORTFOLIO</p>

    <main class="simple-page-content">
        <h2>GAMES</h2>
        <p>Game projects will be added here.</p>
    </main>

    <footer class="home-footer">
        <div class="home-footer-rule"></div>
        <p>© Minja's Portfolio</p>
    </footer>

    <a class="back-to-top" href="#top" aria-label="Back to top">
        <img src="assets/figma/circle_up.svg" alt="">
        <img class="back-to-top-hover" src="assets/figma/circle_up_hoverstate.svg" alt="">
    </a>
    <script>
        const backToTop = document.querySelector(".back-to-top");
        const updateBackToTop = () => backToTop.classList.toggle("is-visible", window.scrollY > 160);
        window.addEventListener("scroll", updateBackToTop, { passive: true });
        updateBackToTop();
    </script>
    <script>
        if (window.matchMedia("(pointer: fine) and (prefers-reduced-motion: no-preference)").matches) {
            document.addEventListener("pointermove", event => {
                document.body.style.setProperty("--cursor-x", `${event.clientX}px`);
                document.body.style.setProperty("--cursor-y", `${event.clientY}px`);
                document.body.classList.add("cursor-glow-active");
            }, { passive: true });
            document.documentElement.addEventListener("pointerleave", () => {
                document.body.classList.remove("cursor-glow-active");
            });
            window.addEventListener("blur", () => {
                document.body.classList.remove("cursor-glow-active");
            });
        }
    </script>

    <script>
        const personalStudyIds = [
            "armor-study-2",
            "armor-study-1",
            "blueberry-study",
            "watermelon-study",
            "tangerine-study",
            "grape-study",
            "lemon-study",
            "tomato-study",
            "strawberry-study"
        ];
        const legacyStudyId = window.location.hash.slice(1);

        if (personalStudyIds.includes(legacyStudyId)) {
            window.location.replace(`index.html#${legacyStudyId}`);
        }
    </script>
</body>
</html>
